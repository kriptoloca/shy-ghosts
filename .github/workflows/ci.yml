name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The level files must be byte for byte what the code builds, within Gate A's 10 minutes on
      # this runner (GENERATOR.md §8–§9, A8; the script also fails itself above 600 s). The
      # audio check joins here with the synthesized sounds (Epic 4).
      - run: npm run levels:check
        timeout-minutes: 10
      - run: npm run build
      - run: npm run size
      - run: npm run zip:only
      - uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: release/*.zip
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
